[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "care_emergency"
version = "0.1.0"
description = "Emergency registration, triage and medico-legal (MLC) records for Care"
requires-python = ">=3.13"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["care_emergency*"]

[tool.ruff]
target-version = "py313"
extend-exclude = ["*/migrations/*"]
